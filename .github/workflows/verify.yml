name: Verify Unified Revenue Authority
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main", "feature/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Functions dependencies
        run: npm install --prefix functions --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          find assets functions -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n 1 node --check
          node --input-type=module -e "await import('./functions/index.js')"
      - name: Run financial calculation and identity tests
        run: npm test --prefix functions

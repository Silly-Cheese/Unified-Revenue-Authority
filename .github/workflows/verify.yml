name: Verify Unified Revenue Authority
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main", "feature/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Functions dependencies
        run: npm install --prefix functions --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/tax.js
          node --check assets/treasury.js
          node --check assets/cases.js
          node --check assets/simulation.js
          node --check assets/documents.js
          node --check assets/enterprise.js
          node --check assets/portal.js
          node --check assets/auth.js
          node --check assets/firebase.js
          node --check functions/index.js
          node --check functions/tax.js
          node --check functions/treasury.js
          node --check functions/cases.js
          node --check functions/simulation.js
          node --check functions/enterprise.js
          node --check functions/portal.js
          node --check functions/lib/portal-access.js
          node --check functions/lib/reporting.js
          node --check functions/lib/simulation-engine.js
          node --check functions/lib/case-workflow.js
          node --check functions/lib/treasury-engine.js
          node --check functions/lib/tax-engine.js
          node --check functions/scripts/bootstrap.js
      - name: Run financial calculation and identity tests
        run: npm test --prefix functions
